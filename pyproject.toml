[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "passnat-cli"
version = "0.1.0"
description = "Unofficial PassNAT CLI for port management and shared HTTPS previews"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "zxbdzh"}]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://zxbdzh.github.io/passnat-cli/"
Repository = "https://github.com/zxbdzh/passnat-cli"
Issues = "https://github.com/zxbdzh/passnat-cli/issues"

[project.scripts]
passnat = "passnat.cli:main"

[tool.setuptools.packages.find]
include = ["passnat*"]
